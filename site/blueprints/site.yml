title: CRG

tabs:

  home:
    label: Home
    icon: home
    sections:
      home_fields:
        type: fields
        fields:
          welcome:
            label: Welcome Text
            type: textarea
            help: The introductory paragraph at the top of the home page
          line-a:
            type: line
          meeting_info:
            label: Meeting Info
            type: textarea
            help: Schedule, platform, timezone, and satellite group details
          line-b:
            type: line
          newsletter_email:
            label: Newsletter Email
            type: email
            help: Email address for the newsletter signup link

  doings:
    label: Doings
    icon: info
    sections:
      doings_page:
        type: pages
        headline: Doings
        parent: site
        status: all
        templates:
          - doings
        create: false

  readings:
    label: Readings
    icon: book
    columns:
      left:
        width: 2/3
        sections:
          readings_live:
            extends: sections/readings
            headline: Live
            limit: 15
            status: listed
      right:
        width: 1/3
        sections:
          readings_drafts:
            extends: sections/readings
            headline: Drafts
            status: draft
          readings_hidden:
            extends: sections/readings
            headline: Hidden
            status: unlisted

  workshops:
    label: Workshops
    icon: bolt
    columns:
      intro:
        width: 1/3
        sections:
          workshop_intro_fields:
            type: fields
            fields:
              workshopIntro:
                label: Workshop Submission Instructions
                type: textarea
                help: Shown at the top of the Workshops tab on the public site
      list:
        width: 2/3
        sections:
          workshops_list:
            type: pages
            headline: Workshops
            parent: kirby.page('readings')
            status: all
            templates:
              - workshop
            create: false

  semantic_network:
    label: Map
    icon: text
    sections:
      terms_list:
        type: pages
        headline: Terms
        parent: kirby.page('words')
        status: all
        templates:
          - term
        create: true
        layout: list
        info: "{{ page.category }} · {{ page.temporal }}"
        sortBy: title asc

  gleanings:
    label: Gleanings
    icon: article
    sections:
      gleanings_list:
        type: pages
        headline: Gleanings
        parent: site.find('gleanings')
        status: all
        templates:
          - gleaning
        create: true
        layout: list
        info: "{{ page.byline }}"
        sortBy: date desc

  toolkit:
    label: Toolkit
    icon: list
    columns:
      toolkit_col:
        width: 3/3
        sections:
          toolkit_fields:
            type: fields
            fields:
              toolkitHeading:
                type: headline
                label: "CRG Toolkit Sidebar"
                numbered: false
              toolkitEssential:
                type: structure
                label: Essential Resources
                fields:
                  name:
                    type: text
                    label: Name
                    required: true
                  url:
                    type: url
                    label: URL
              toolkitDatabases:
                type: structure
                label: Useful Databases & Ontologies
                fields:
                  name:
                    type: text
                    label: Name
                    required: true
                  url:
                    type: url
                    label: URL
              toolkitArchives:
                type: structure
                label: Archives & Libraries
                fields:
                  name:
                    type: text
                    label: Name
                    required: true
                  url:
                    type: url
                    label: URL
              toolkitIndexes:
                type: structure
                label: Indexes, Bibliographies & Textbooks
                fields:
                  name:
                    type: text
                    label: Name
                    required: true
                  url:
                    type: url
                    label: URL
              toolkitJournals:
                type: structure
                label: Salient Journals
                fields:
                  name:
                    type: text
                    label: Name
                    required: true
                  url:
                    type: url
                    label: URL
              toolkitInspiration:
                type: structure
                label: Sources of Inspiration
                fields:
                  name:
                    type: text
                    label: Name
                    required: true
                  url:
                    type: url
                    label: URL

  weavings:
    label: Weavings
    icon: tag
    sections:
      weavings_page:
        type: pages
        headline: Weavings
        parent: site
        status: all
        templates:
          - weavings
        create: false

  bookmarks:
    label: Bookmarks
    icon: bookmark
    sections:
      bookmarks_page:
        type: pages
        headline: Community Bookmarks
        parent: site
        status: all
        templates:
          - bookmarks
        create: false
