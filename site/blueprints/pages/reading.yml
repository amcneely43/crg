title: Reading
icon: 📖

status:
  draft: Draft
  unlisted: Hidden
  listed: Live

columns:
  main:
    width: 2/3
    fields:

      # ── Status & Identity ──────────────────────────────────────────────
      current:
        label: Currently Reading?
        type: toggle
        width: 1/3
        text:
          - "no"
          - "yes"

      date:
        label: Start Date
        type: date
        width: 1/3
        default: today
        display: MM-DD-YYYY

      author:
        type: text
        width: 1/2
        required: true

      subtitle:
        type: text
        width: 1/2

      line-a:
        type: line

      # ── Content ───────────────────────────────────────────────────────
      note:
        label: Intro
        type: textarea

      blurb:
        label: Opening Remarks
        type: textarea

      nominatedBy:
        label: Nominated By
        type: text

      flyerBy:
        label: Flyer By
        type: text

      line-b:
        type: line

      # ── Terms & Links ─────────────────────────────────────────────────
      terms:
        label: Semantic Terms
        type: pages
        query: kirby.page('words').children
        multiple: true

      bookstackUrl:
        label: BookStack URL
        type: url
        help: Link to this reading's BookStack page

      download_reading:
        label: Link to Reading
        type: url
        help: Hosted at Critical Inquiry Theory

      line-c:
        type: line

      links:
        label: Supplementary Resources
        type: structure
        help: Limit to 4 per reading
        fields:
          description:
            type: text
          url:
            label: URL
            type: url

      interlocutors:
        label: Interlocutors
        type: structure
        help: Recommendation — link to the Stanford Encyclopedia of Philosophy
        fields:
          name:
            type: text
          stanford_url:
            label: Link
            type: url

  sidebar:
    width: 1/3
    sections:

      cover:
        type: files
        multiple: false
        headline: Book Cover
        template: cover
        layout: cards
        cover: true
        ratio: 5/2
        back: white
        info: "{{ file.dimensions }}"

      flyer:
        type: files
        multiple: false
        headline: Event Flyer
        layout: cards
        cover: true
        ratio: 5/2
        back: white
        info: "{{ file.dimensions }}"
