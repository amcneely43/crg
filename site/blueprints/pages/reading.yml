title: Reading
icon: 📖

status:
  draft: Draft
  unlisted: Hidden
  listed: Live

columns:
  main:
    width: 2/3
    fields:

      # ── Status & Identity ──────────────────────────────────────────────
      current:
        label: Currently Reading?
        type: toggle
        width: 1/3
        text:
          - "no"
          - "yes"

      date:
        label: Start Date
        type: date
        width: 1/3
        default: today
        display: MM-DD-YYYY

      session_type:
        label: Session Type
        type: select
        width: 1/3
        options:
          regular: Regular
          guest_scholar: Guest Scholar
          workshop: Workshop

      author:
        type: text
        width: 1/2
        required: true

      subtitle:
        type: text
        width: 1/2

      line-a:
        type: line

      # ── Content ───────────────────────────────────────────────────────
      note:
        label: Intro
        type: textarea

      blurb:
        label: Blurb
        type: textarea

      contributor:
        label: Contributor
        type: text

      line-b:
        type: line

      # ── Terms & Links ─────────────────────────────────────────────────
      keywords:
        label: Keywords
        type: tags

      bookstackUrl:
        label: BookStack URL
        type: url
        help: Link to this reading's BookStack page

      download_reading:
        label: Link to Reading
        type: url
        width: 2/3
        help: Hosted at Critical Inquiry Theory

      hosted_elsewhere:
        label: Hosted elsewhere?
        type: toggle
        width: 1/3
        text:
          - "no"
          - "yes"

      line-c:
        type: line

      links:
        label: Supplementary Resources
        type: structure
        help: Limit to 4 per reading
        fields:
          description:
            type: text
          url:
            label: URL
            type: url

      interlocutors:
        label: Interlocutors
        type: structure
        help: Recommendation — link to the Stanford Encyclopedia of Philosophy
        fields:
          name:
            type: text
          stanford_url:
            label: Link
            type: url

      attachments:
        label: Attachments
        type: files

  sidebar:
    width: 1/3
    sections:

      cover:
        type: files
        multiple: false
        headline: Book Cover
        template: cover
        layout: cards
        cover: true
        ratio: 5/2
        back: white
        info: "{{ file.dimensions }}"

      meme:
        type: files
        multiple: false
        headline: Memes
        template: meme

      meta:
        type: fields
        fields:
          location:
            label: Location
            type: text
          custom_time:
            label: Custom Day & Time
            type: text
          show_date:
            label: Show Date in Header
            type: toggle
            default: false
            help: Displays date in the top-left header
